  <style>
/* 乡土调查员 · 纸墨手记风（宣纸底 / 墨字 / 朱砂印；无渐变无 emoji） */
:root {
  --paper: #f4efe2;
  --paper-2: #efe8d6;
  --ink: #2f2a22;
  --ink-2: #5a5245;
  --ink-3: #8a7f6c;
  --line: #c9bda2;
  --cinnabar: #a4443a;
  --cinnabar-2: #8c4a3c;
  --green: #55663f;
  --gold: #8a6d2f;
  --shadow: 0 1px 0 rgba(90, 82, 69, .18), 0 6px 18px -10px rgba(60, 50, 30, .35);
  --radius: 6px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper);
  color: var(--ink);
  font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "Songti SC", serif;
  line-height: 1.75;
  background-image: radial-gradient(rgba(120, 100, 60, .05) 1px, transparent 1px);
  background-size: 22px 22px;
}
#app { max-width: 1020px; margin: 0 auto; padding: 18px 16px 60px; }
a { color: var(--cinnabar); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { font-weight: 700; letter-spacing: .04em; }
h1 { font-size: 26px; margin: 10px 0 6px; }
h2 { font-size: 19px; margin: 26px 0 10px; padding-left: 10px; border-left: 4px solid var(--cinnabar); }
h3 { font-size: 16px; margin: 8px 0; }
p { margin: 8px 0; }
.empty { color: var(--ink-3); padding: 26px 0; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.hint { color: var(--ink-3); font-size: 13px; }

/* 首页 hero */
.hero { text-align: center; padding: 34px 12px 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); position: relative; box-shadow: var(--shadow); }
.hero::after { content: "乡土"; position: absolute; right: 18px; top: 16px; width: 46px; height: 46px; line-height: 46px; text-align: center; color: #fff; background: var(--cinnabar); border-radius: 4px; font-size: 15px; letter-spacing: 2px; opacity: .92; transform: rotate(6deg); }
.hero-badge { display: inline-block; border: 1px solid var(--line); background: #fff9; padding: 2px 12px; border-radius: 999px; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
.hero h1 { font-size: 40px; margin: 6px 0 0; letter-spacing: .18em; }
.hero-sub { color: var(--ink-2); letter-spacing: .3em; margin: 4px 0 12px; }
.hero-saying { font-size: 15px; color: var(--ink-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: inline-block; padding: 6px 18px; margin: 6px 0 14px; }
.hero-stat { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0 14px; }
.hero-nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* chips 与按钮 */
.chip { display: inline-block; border: 1px solid var(--line); background: #fff8; border-radius: 999px; padding: 1px 10px; font-size: 12px; color: var(--ink-2); }
.chip.big { font-size: 14px; padding: 3px 14px; }
.chip.ok { border-color: var(--green); color: var(--green); }
.chip.bad { border-color: var(--cinnabar); color: var(--cinnabar); }
.chip.ghost { background: transparent; }
.chip.sm { font-size: 11px; padding: 0 8px; }
.btn { display: inline-block; border: 1px solid var(--ink-2); background: var(--paper-2); color: var(--ink); border-radius: var(--radius); padding: 6px 16px; font-size: 14px; cursor: pointer; font-family: inherit; letter-spacing: .05em; }
.btn:hover { background: #fff; text-decoration: none; }
.btn.primary { background: var(--cinnabar); border-color: var(--cinnabar); color: #fff; }
.btn.primary:hover { background: #93372e; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 2px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* 章节/村落卡 */
.sec-sub { color: var(--ink-2); font-size: 14px; margin-top: 0; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.chcard { display: flex; gap: 12px; border: 1px solid var(--line); background: #fff7; border-radius: var(--radius); padding: 12px; color: inherit; box-shadow: var(--shadow); }
.chcard:hover { background: #fff; text-decoration: none; }
.chcard.read { background: var(--paper-2); }
.chno { flex: 0 0 auto; width: 40px; height: 40px; border: 1px solid var(--cinnabar); color: var(--cinnabar); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.chbody { min-width: 0; }
.chtitle { font-weight: 700; font-size: 16px; }
.chtheme { font-size: 12px; color: var(--cinnabar); border: 1px solid var(--cinnabar); padding: 0 6px; border-radius: 999px; margin-left: 4px; font-weight: 400; }
.chblurb { font-size: 13px; color: var(--ink-2); margin: 4px 0; }
.chmeta { display: flex; gap: 6px; flex-wrap: wrap; }
.vilgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.vilcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; color: inherit; background: #fff7; box-shadow: var(--shadow); }
.vilcard:hover { background: #fff; text-decoration: none; }
.vilname { font-size: 18px; font-weight: 700; }
.viltype { font-size: 12px; color: var(--ink-3); margin: 2px 0 6px; }
.vilprog { font-size: 12px; color: var(--green); }

/* 章节详情 */
.crumb { margin: 8px 0; font-size: 13px; }
.geo-chip { color: var(--gold); font-size: 13px; margin: 0; }
.concgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.conc { border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: var(--radius); padding: 10px 12px; background: #fff7; }
.conc-name { font-weight: 700; }
.conc-def { font-size: 13px; color: var(--ink-2); }
.excerpt { margin: 12px 0; padding: 12px 14px; border: 1px solid var(--line); border-left: 4px solid var(--cinnabar); background: #fff9; border-radius: var(--radius); }
.extag { display: inline-block; font-size: 11px; color: #fff; background: var(--cinnabar); border-radius: 3px; padding: 0 6px; margin-right: 8px; vertical-align: 2px; }
.tasks { padding-left: 20px; }
.tasks .hint { margin-left: 6px; }
.action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

/* 村落 */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin: 14px 0; }
.tabs a { padding: 6px 14px; color: var(--ink-2); border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; }
.tabs a.on { background: var(--paper-2); border-color: var(--line); color: var(--ink); font-weight: 700; }
.progress-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.gtab, .atab, .ctab { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff7; }
.gtab th, .atab th, .ctab th, .gtab td, .atab td, .ctab td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.gtab th, .atab th, .ctab th { background: var(--paper-2); width: 130px; white-space: nowrap; }
.vmap { width: 100%; max-width: 640px; display: block; margin: 0 auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff7; box-shadow: var(--shadow); }
.npcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.npccard { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: #fff7; }
.npc-name { font-weight: 700; font-size: 16px; }
.npc-role { color: var(--cinnabar); font-size: 12px; margin: 2px 0 6px; }
.npc-knows { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.findlist .find { border: 1px dashed var(--line); border-radius: var(--radius); padding: 8px 12px; margin: 6px 0; color: var(--ink-3); }
.findlist .find.on { border: 1px solid var(--gold); color: var(--ink); background: #fff9; }
.findlist .find.on b { color: var(--gold); }

/* 地图观察 */
.mapwrap { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 760px) { .mapwrap { grid-template-columns: 1fr; } }
.sidepanel { border: 1px solid var(--line); border-radius: var(--radius); background: #fff7; padding: 12px; min-height: 200px; box-shadow: var(--shadow); }
.fnote { color: var(--ink-2); font-size: 14px; }
.ask { margin: 10px 0 4px; font-size: 14px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.opt { font-size: 14px; }
.ask-result { margin-top: 8px; padding: 8px 10px; border-radius: var(--radius); font-size: 13px; }
.ask-result.ok { border: 1px solid var(--green); color: var(--green); background: #f2f5ea; }
.ask-result.bad { border: 1px solid var(--cinnabar); color: var(--cinnabar-2); background: #f7ece7; }
.okline { color: var(--green); font-size: 13px; }
.badline { color: var(--cinnabar-2); font-size: 13px; }
.taggrid, .tagrow { display: flex; flex-wrap: wrap; gap: 8px; }
.tagpick { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; background: #fff8; cursor: pointer; }
.tagpick.sm { font-size: 12px; padding: 2px 8px; }
.tagpick input { vertical-align: -2px; }
.tagfrom { color: var(--ink-3); font-size: 11px; margin-left: 4px; }
svg .fm { cursor: pointer; outline: none; }
svg .fm:focus text, svg .fm:hover text { fill: var(--cinnabar); }
svg .fm.seen > g { opacity: .95; }
svg .fm.seen text { fill: var(--green); }
svg .fm.seen > g:first-child { filter: none; }
svg .fm.seen circle:first-child, svg .fm.seen rect:first-child { stroke: var(--green); }

/* 访谈 */
.npctabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
.npctab { border: 1px solid var(--line); background: #fff8; border-radius: var(--radius); padding: 6px 12px; cursor: pointer; font-family: inherit; font-size: 14px; }
.npctab span { display: block; font-size: 11px; color: var(--ink-3); }
.npctab.on { border-color: var(--cinnabar); background: var(--paper-2); box-shadow: var(--shadow); }
.modebadge { font-size: 12px; color: var(--ink-3); margin: 0; }
.chatwrap { border: 1px solid var(--line); border-radius: var(--radius); background: #fff9; box-shadow: var(--shadow); }
.chatlog { height: 340px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.bub { max-width: 86%; }
.bub .bub-text { padding: 10px 14px; border-radius: 10px; font-size: 15px; white-space: pre-wrap; }
.bub.me { align-self: flex-end; }
.bub.me .bub-text { background: var(--cinnabar); color: #fff; border-bottom-right-radius: 2px; }
.bub.npc { align-self: flex-start; }
.bub.npc .bub-text { background: var(--paper-2); border: 1px solid var(--line); border-bottom-left-radius: 2px; }
.bub-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.ansmeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.chatbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
.chatbar input { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; font-family: inherit; font-size: 15px; background: #fff; }
.mat { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; margin: 8px 0; background: #fff7; }
.mat-meta { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mat-text { font-size: 14px; margin-top: 4px; }

/* 分析 */
.score-ring { display: inline-flex; align-items: baseline; border: 2px solid var(--cinnabar); color: var(--cinnabar); border-radius: 50%; width: 72px; height: 72px; align-items: center; justify-content: center; font-size: 22px; }
.score-ring small { font-size: 12px; margin-left: 2px; }
.atab tr.ok td { background: #f2f5ea; }
.atab td i { color: var(--ink-3); }
.atab td:nth-child(4) { font-weight: 700; }

/* 报告 */
textarea#report-text { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; font-family: inherit; font-size: 14px; line-height: 1.8; background: #fff9; }
.gradebox { border: 1px solid var(--gold); border-radius: var(--radius); background: #fff9; padding: 12px 16px; margin-top: 12px; }
.grade-score { font-size: 18px; color: var(--gold); font-weight: 700; }
.reportpre { white-space: pre-wrap; font-family: inherit; border: 1px dashed var(--line); padding: 12px; border-radius: var(--radius); background: #fff9; max-height: 320px; overflow: auto; }
.demo-note { border: 1px dashed var(--gold); color: var(--gold); background: #fff9; padding: 8px 12px; border-radius: var(--radius); font-size: 13px; }

/* 教师端 */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
.kpi { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; text-align: center; background: #fff7; }
.kpi b { font-size: 24px; color: var(--cinnabar); display: block; }
.kpi span { font-size: 12px; color: var(--ink-2); }
.atab td.mis { font-size: 12px; color: var(--ink-2); max-width: 280px; }
.formrow { display: flex; gap: 10px; align-items: center; margin: 8px 0; }
.formrow label { flex: 0 0 84px; font-size: 14px; color: var(--ink-2); }
.formrow select, .formrow input { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; font-family: inherit; background: #fff; max-width: 460px; }
.task, .review { border: 1px solid var(--line); border-radius: var(--radius); background: #fff7; padding: 12px 16px; margin: 10px 0; box-shadow: var(--shadow); }
.review-head { margin-bottom: 6px; }
.verdict-in { flex: 1; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; font-family: inherit; min-width: 200px; }

/* 成就 */
.lvlbar { height: 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff8; overflow: hidden; }
.lvl-fill { height: 100%; background: var(--cinnabar); }
.achgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.ach { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; color: var(--ink-3); background: #fff5; }
.ach.on { border-color: var(--gold); color: var(--ink); background: #fff9; box-shadow: var(--shadow); }
.ach-name { font-weight: 700; }
.ach.on .ach-name { color: var(--gold); }
.ach-desc { font-size: 12px; }

/* 设置 */
.promptcard { border: 1px solid var(--line); border-radius: var(--radius); background: #fff7; padding: 12px 16px; margin: 10px 0; }
.prompt-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.promptpre { white-space: pre-wrap; font-family: "FangSong", "STFangsong", serif; font-size: 13px; border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px; max-height: 220px; overflow: auto; background: #fff9; }
.foot { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 40px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 8px 20px; border-radius: 999px; font-size: 14px; opacity: 0; transition: all .3s; z-index: 99; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: .95; transform: translateX(-50%) translateY(0); }

@media print { .toast, .btn { display: none; } }


/* ============================================================
 * 质感升级层（夜跑阶段A）：手绘田野手账风
 * ============================================================ */

/* hero 场景插画与手账元素 */
.hero-scenewrap { position: relative; margin: 10px auto 4px; max-width: 560px; }
.heroscene { width: 100%; display: block; filter: sepia(.08); }
.hero-anno {
  position: absolute; right: -6px; top: 6px;
  font-family: "Kaiti SC", "KaiTi", "STKaiti", serif;
  color: var(--cinnabar); font-size: 13px; line-height: 1.4;
  writing-mode: vertical-rl; letter-spacing: .18em;
  border-right: 1px solid var(--cinnabar);
  padding: 6px 4px 6px 8px; opacity: .85;
  background: rgba(244, 239, 226, .6);
}
.tapenote {
  position: absolute; left: -8px; bottom: -6px;
  background: rgba(138, 109, 47, .16);
  border-left: 3px solid rgba(138, 109, 47, .5);
  border-right: 3px solid rgba(138, 109, 47, .5);
  color: var(--ink-2); font-size: 12px; padding: 3px 16px;
  transform: rotate(-2.5deg); letter-spacing: .2em;
}
.hero-saying { margin-top: 16px; }

/* 章节卡：纸纹 + 印章 + 微动效 */
.chcard {
  position: relative; overflow: hidden;
  background-image: repeating-linear-gradient(0deg, transparent 0 26px, rgba(120, 100, 60, .06) 26px 27px);
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.chcard:hover { transform: translateY(-3px); box-shadow: 0 2px 0 rgba(90, 82, 69, .18), 0 14px 26px -12px rgba(60, 50, 30, .45); text-decoration: none; }
.chcard:hover .chno { transform: rotate(-2deg) scale(1.06); }
.chno {
  background: var(--cinnabar); color: #f7f1e1;
  border: none; border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(255, 245, 225, .35), 0 2px 5px -2px rgba(120, 40, 30, .6);
  transform: rotate(-3deg);
  transition: transform .18s ease;
  font-weight: 700;
}
.stamp-read {
  position: absolute; top: 8px; right: 10px;
  border: 2px solid var(--green); color: var(--green);
  padding: 0 7px; font-size: 12px; letter-spacing: .3em;
  transform: rotate(7deg); border-radius: 3px;
  background: rgba(255, 255, 255, .4); opacity: .9;
  font-weight: 700;
}

/* 村落卡：脊色 + 悬停 */
.vilcard { position: relative; border-left: 5px solid var(--spine, #7a5a38); background-image: repeating-linear-gradient(0deg, transparent 0 26px, rgba(120, 100, 60, .06) 26px 27px); transition: transform .18s ease, box-shadow .18s ease; }
.vilcard:hover { transform: translateY(-3px); box-shadow: 0 2px 0 rgba(90, 82, 69, .18), 0 14px 26px -12px rgba(60, 50, 30, .45); text-decoration: none; }
.vilcard::after {
  content: "村"; position: absolute; right: 10px; top: 10px;
  width: 26px; height: 26px; line-height: 26px; text-align: center;
  background: var(--spine, #7a5a38); color: #f7f1e1;
  border-radius: 3px; font-size: 13px; transform: rotate(6deg);
  opacity: .9;
}

/* 按钮微动效 */
.btn { transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 14px -8px rgba(140, 40, 30, .7); }

/* 地图图例（HTML，随图渲染） */
.maplegend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; margin: 8px auto 0; max-width: 640px; font-size: 12px; color: var(--ink-2); }
.maplegend .lg { display: inline-flex; align-items: center; gap: 5px; }
.maplegend .lg i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid #3d3428; display: inline-block; }

/* 标题手账感：双线尾饰 */
.sec h2 { display: flex; align-items: center; gap: 10px; }
.sec h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 3px; opacity: .7; }

/* 表格斑马纹 */
.atab tr:nth-child(even) td, .ctab tr:nth-child(even) td, .gtab tr:nth-child(even) td { background: rgba(255, 255, 255, .5); }

/* ============================================================
 * 移动端适配（≤760px）
 * ============================================================ */
@media (max-width: 760px) {
  #app { padding: 12px 10px 50px; }
  h1 { font-size: 21px; }
  .hero { padding: 24px 10px 18px; }
  .hero h1 { font-size: 30px; letter-spacing: .12em; }
  .hero::after { width: 36px; height: 36px; line-height: 36px; font-size: 12px; right: 10px; top: 10px; }
  .hero-anno { font-size: 11px; right: -2px; }
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
  .tabs a { white-space: nowrap; flex: 0 0 auto; }
  .gtab, .atab, .ctab { display: block; overflow-x: auto; white-space: nowrap; }
  .chatlog { height: 300px; padding: 10px; }
  .bub { max-width: 94%; }
  .score-ring { width: 60px; height: 60px; font-size: 18px; }
  .hero-nav { gap: 6px; }
  .btn { padding: 6px 12px; font-size: 13px; }
  .review .action-row { flex-direction: column; align-items: stretch; }
  .verdict-in { min-width: 0; }
  .kpi b { font-size: 20px; }
  .reportpre { max-height: 220px; }
}


/* ============================================================
 * 批注框与打印样式（夜跑阶段C · 方向一/方向六）

(function (global) {
  'use strict';
  const root = (typeof window !== 'undefined') ? window : global;

  const LIST = [root.XT_VILLAGE_V1, root.XT_VILLAGE_V2, root.XT_VILLAGE_V3, root.XT_VILLAGE_V4];

  const API = {
    VILLAGES: LIST,
    village(id) { return LIST.find(v => v.id === id) || null; },
    feature(vId, fId) {
      const v = API.village(vId);
      return v ? v.features.find(f => f.id === fId) || null : null;
    },
    npc(vId, nId) {
      const v = API.village(vId);
      return v ? v.npcs.find(n => n.id === nId) || null : null;
    },
    find(vId, fdId) {
      const v = API.village(vId);
      return v ? v.finds.find(d => d.id === fdId) || null : null;
    },
    /** 本村概念池：对口章节概念 + 空间真值/发现/NPC 规则实际用到的概念（保证真值永不被池过滤） */
    conceptPool(vId) {

      if (!v) return [];
      const set = new Set();
      (v.chapters || []).forEach(cId => {
        const ch = root.XT_BOOK && root.XT_BOOK.chapter(cId);
        if (ch) ch.concepts.forEach(c => set.add(c.id));
      });
      v.features.forEach(f => (f.truth || []).forEach(c => set.add(c)));
      (v.finds || []).forEach(d => set.add(d.concept));
      v.npcs.forEach(n => n.rules.forEach(r => { if (r.concept) set.add(r.concept); }));

  <script>
/* ============================================================
 * 引擎核心（纯逻辑，禁 DOM）：状态机 / NPC 离线对话 / 空间语义分析 /
 * 报告生成与初评 / 成就与等级 / 教师端模拟班级 / 双村对比
 * 纪律：一切函数确定性可测；种子哈希只用输入串；越界一律安全回落。
 * ============================================================ */
(function (global) {
  'use strict';
  const root = (typeof window !== 'undefined') ? window : global;

  /* ---------- 基础工具 ---------- */
  function hash32(str) {
    let h = 2166136261 >>> 0;
    const s = String(str || '');
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

    let a = seed >>> 0;

      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normQ(s) {

      .replace(/[\s，。、；：？！“”‘’"'\.,;:\?\!()（）\[\]【】\-—·~～]/g, '');

  /* ---------- 状态机 ---------- */
  const STATE_VERSION = 1;

  function newState(name) {
    return {
      version: STATE_VERSION,
      createdAt: new Date().toISOString(),
      student: { name: name || '无名调查员' },
      points: 0,
      seq: 1,
      chapters: {},          // c01: {read:true, at}
      villages: {},          // v1: {visited, features:{}, talks:{}, analysis:{}, report:{}}
      achievements: [],      // 'a01'
      compareDone: [],       // 'v1|v2'
      tasks: [],             // 教师发布 {id, chId, deadline, criteria, at}
      notes: {},             // 学生批注 { 'c01#2': text }（节选批注）/ 'mat:m0003'（素材评语）

      logs: []               // 事件留痕（上限 200）
    };
  }
  function vState(state, vId) {
    if (!state.villages[vId]) state.villages[vId] = { visited: false, features: {}, talks: {}, analysis: null, report: { text: '', submitted: null } };
    return state.villages[vId];
  }
  function log(state, type, detail) {
    state.logs.push({ t: Date.now(), type: type, d: String(detail || '').slice(0, 120) });
    if (state.logs.length > 200) state.logs = state.logs.slice(-200);

  function addPoints(state, n) {
    state.points = Math.max(0, (state.points || 0) + n);

  }
  function readChapter(state, chId) {
    if (!state.chapters[chId]) {

  }
  function visit(state, vId) {
    const v = vState(state, vId);
    if (!v.visited) { v.visited = true; addPoints(state, 2); log(state, 'visit', vId); }
    return v;
  }

  /* ---------- NPC 离线对话引擎（确定性） ---------- */
  function pickRule(npc, question) {
    const q = normQ(question);
    if (!q) return null;
    let best = null, bestHits = 0;
    for (const r of (npc.rules || [])) {
      let hits = 0;
      for (const kw of (r.kws || [])) {
        const k = normQ(kw);
        if (k && q.indexOf(k) >= 0) hits++;

      if (hits > bestHits) { best = r; bestHits = hits; }

    if (total >= MATERIAL_CAP) return null;
    if (t.materials.length >= NPC_MATERIAL_CAP) return null;
    if (answer.isFallback) return null; // 回落句不采集
    const m = {
      id: nowId(state.seq++),
      npc: npc.id, npcName: npc.name, role: npc.role,
      text: String(answer.text || '').slice(0, 400),
      tags: (answer.tags || []).slice(),
      ruleId: answer.ruleId || null,
      at: new Date().toISOString()

    t.materials.push(m);
    if (answer.ruleId) t.rulesHit[answer.ruleId] = (t.rulesHit[answer.ruleId] || 0) + 1;
    addPoints(state, 1);
    log(state, 'material', m.id + '@' + npc.id);
    return m;
  }
  function reTagMaterial(state, vId, matId, tags) {
    const v = vState(state, vId);
    for (const k of Object.keys(v.talks)) {
      const m = v.talks[k].materials.find(x => x.id === matId);

  /* ---------- 空间观察与概念标注 ---------- */
  function featureState(state, vId, fId) {

  function observe(state, vId, feature, choice) {

    fs.askOk = (choice === feature.ask.answer) ? 1 : 0;
    if (fs.askOk) addPoints(state, 2);

  }

  }
  /**
   * 空间语义分析（对照真值，确定性）

  function analyzeVillage(state, vId, village, pool) {
    const v = vState(state, vId);
    const rows = [];
    let taggedRight = 0, askRight = 0, observed = 0, tagged = 0;
    for (const f of village.features) {
      const fs = v.features[f.id];
      if (!fs || (!fs.seen && !(fs.myTags || []).length)) continue;
      observed++;
      const truth = f.truth || [];
      const mine = (fs.myTags || []).filter(c => truth.indexOf(c) >= 0);
      if ((fs.myTags || []).length) tagged++;
      if (mine.length) taggedRight++;
      if (fs.askOk === 1) askRight++;
      rows.push({
        fId: f.id, name: f.name,
        mine: (fs.myTags || []).slice(),
        truth: truth.slice(),
        ok: mine.length > 0,
        full: mine.length === truth.length && truth.length > 0 && fs.myTags.length === truth.length,
        analysis: f.analysis
      });
    }
    const maxA = village.features.length * 2;
    const score = maxA ? Math.round(100 * (taggedRight * 2 + askRight) / maxA) : 0;
    const finds = (village.finds || []).filter(d => {
      const f = village.features.find(x => (x.truth || []).indexOf(d.concept) >= 0 && rows.some(r => r.fId === x.id && r.full));
      return !!f;
    });

    v.finds = v.finds || {};
    finds.forEach(d => {
      const fdId = d.id;
      if (!v.finds[fdId]) { v.finds[fdId] = true; addPoints(state, 3); log(state, 'find', fdId); }
    });
    const result = { at: new Date().toISOString(), rows: rows, score: clamp(score, 0, 100), stats: { observed: observed, tagged: tagged, taggedRight: taggedRight, askRight: askRight }, finds: finds.map(d => d.id) };
    // 首次分析且全场 ask 全对 → 加分
    const allAsk = village.features.filter(f => f.ask).every(f => v.features[f.id] && v.features[f.id].askOk === 1);
    if (allAsk && village.features.length && !v.analysis) addPoints(state, 6);

    log(state, 'analyze', vId + '=' + result.score);
    return result;
  }
  function discoverFind(state, vId, findId) {
    const v = vState(state, vId);
    if (!v.finds) v.finds = {};
    if (!v.finds[findId]) { v.finds[findId] = true; addPoints(state, 3); log(state, 'find', findId); return true; }
    return false;
  }

  /* ---------- 学生批注 ---------- */
  const NOTE_CAP = 500;
  function setNote(state, key, text) {
    if (!key) return { ok: false };
    const t = String(text || '').trim().slice(0, NOTE_CAP);
    state.notes = state.notes || {};
    const had = !!state.notes[key];
    if (!t) { delete state.notes[key]; return { ok: true, removed: had }; }

  /* ---------- 报告生成（离线结构化写作） ---------- */
  function buildReport(state, vId, village, book) {

    secs.push({ title: '一、地理背景与村落概况', body: [

    secs.push({ title: '二、聚落形态与空间格局', body: '全村共录得 ' + village.features.length + ' 处空间要素：\n' + featLines.join('\n') + (an ? '\n\n空间语义分析得分：' + an.score + '／100。' : '\n\n（空间语义分析尚未运行。）') });
    // 三：社会结构与人文脉络（按概念归组引用素材）
    const byConcept = {};
    mats.forEach(m => (m.tags || []).forEach(t => { (byConcept[t] = byConcept[t] || []).push(m); }));
    const socLines = Object.keys(byConcept).map(c => {
      const list = byConcept[c].slice(0, 2);
      return '【' + cname(book, c) + '】\n' + list.map(m => '「' + m.text + '」（' + m.npcName + '，' + m.role + '）').join('\n');

    secs.push({ title: '四、经济生产与生计方式', body: [ '主要生计：' + (g.agriculture || '—') + '；' + (g.livelihood || '—') + '。', ecoMats.length ? '村民口述：\n' + ecoMats.map(m => '「' + m.text.slice(0, 120) + '……」（' + m.npcName + '）').join('\n') : '（可在访谈中追问买卖与工钱，充实本节。）' ].join('\n') });
    // 五：以书证乡
    const chs = (village.chapters || []).map(id => book.chapter(id)).filter(Boolean);
    const proofLines = chs.map(ch => {
      const e = ch.excerpts[0] ? '「' + ch.excerpts[0].text.slice(0, 90) + (ch.excerpts[0].text.length > 90 ? '……' : '') + '」（《' + '乡土中国' + '》' + ch.title + '）' : '';
      const hit = rowsHitFor(state, village, ch);
      let line = '· 验证「' + ch.concepts[0].name + '」：' + e + '\n  空间证据：' + (hit || '（待补：回到空间观察页完成标注）');

    });
    secs.push({ title: '五、探究结论——以书证乡', body: proofLines.join('\n') });
    return { village: village.id, sections: secs, plain: secs.map(s => s.title + '\n' + s.body).join('\n\n') };
  }
  function rowsHitFor(state, village, ch) {
    const v = state.villages[village.id];
    if (!v) return '';

      const fs = v.features[f.id];

  function cname(book, conceptId) {

  }

  /* ---------- 报告初评（离线规则评分） ---------- */
  function gradeReport(state, vId, text, village, book) {
    const t = String(text || '');
    const advice = [];
    let score = 0;
    const parts = ['一、', '二、', '三、', '四、', '五、'];
    const partHit = parts.filter(p => t.indexOf(p) >= 0).length;
    score += partHit * 6; // 满分30
    if (partHit < 5) advice.push('结构缺 ' + (5 - partHit) + ' 个部分——对照五部分目录补齐。');
    const len = t.replace(/\s/g, '').length;
    if (len >= 400) score += 20; else advice.push('正文仅约 ' + len + ' 字，建议扩至 400 字以上（现在差 ' + (400 - len) + ' 字）。');
    const mats = vState(state, vId).talks ? Object.keys(state.villages[vId].talks).flatMap(k => state.villages[vId].talks[k].materials) : [];
    const npcNames = village.npcs.map(n => n.name);
    const cited = npcNames.filter(n => t.indexOf(n) >= 0).length;
    score += Math.min(20, cited * 7);
    if (cited < 3) advice.push('引用村民口述不足（检出 ' + cited + ' 位）——多引几位不同身份的村民，观点才有互证。');
    const conceptNames = (village.chapters || []).map(id => book.chapter(id)).filter(Boolean).flatMap(ch => ch.concepts.map(c => c.name));
    const used = conceptNames.filter(n => t.indexOf(n) >= 0).length;
    score += Math.min(15, used * 3);
    if (used < 4) advice.push('核心概念出现 ' + used + ' 个（建议 ≥4）——把概念名写进分析，别只讲故事。');
    const quoteHit = (t.match(/「[^」]{8,}」/g) || []).length;
    score += Math.min(15, quoteHit * 5);
    if (quoteHit < 2) advice.push('直接引语（「」）不足 2 处——田野报告要用村民的原话和书里的原文说话。');
    score = clamp(Math.round(score), 0, 100);
    return { score: score, stars: score >= 85 ? 3 : score >= 70 ? 2 : score >= 50 ? 1 : 0, advice: advice, gradedAt: new Date().toISOString() };
  }
  function submitReport(state, vId, text, village, book) {
    const v = vState(state, vId);

    const grade = gradeReport(state, vId, text, village, book);
    const first = !v.report.submitted;
    const prevBest = v.report.bestScore || 0;
    v.report.submitted = { text: text, grade: grade, verdict: '', at: new Date().toISOString() };
    if (first) addPoints(state, 10);
    if (grade.score >= 85 && grade.score > prevBest) addPoints(state, 5); // 只奖进步，不奖重交
    v.report.bestScore = Math.max(prevBest, grade.score);

  }

  /* ---------- 双村对比（区域差异分析） ---------- */
  function compareVillages(vA, vB, state, book) {
    const rows = [
      { dim: '地域类型', a: vA.type + '（' + vA.region + '）', b: vB.type + '（' + vB.region + '）' },
      { dim: '地形与气候', a: (vA.geoFacts.landform || '') + '；' + (vA.geoFacts.climate || ''), b: (vB.geoFacts.landform || '') + '；' + (vB.geoFacts.climate || '') },
      { dim: '生计方式', a: vA.geoFacts.livelihood || '', b: vB.geoFacts.livelihood || '' },
      { dim: '聚落形态', a:聚落(vA), b:聚落(vB) },
      { dim: '权力与秩序（空间证据）', a: 权力(vA), b: 权力(vB) },
      { dim: '交换与算账（空间证据）', a: 交换(vA), b: 交换(vB) },

  function 交换(v) { const f = v.features.find(x => (x.truth || []).indexOf('c12c') >= 0); return f ? f.name + '：' + f.note : '—'; }

  /* ---------- 成就与称号 ---------- */
  const ACHIEVEMENTS = [

    { id: 'a03', name: '初级调查员', desc: '一村观察题全部答对', test: s => Object.keys(s.villages).some(vid => {

    { id: 'a05', name: '田野高手', desc: '累计收集素材 15 条', test: s => Object.keys(s.villages).reduce((n, vid) => n + Object.keys(s.villages[vid].talks || {}).reduce((m, k) => m + s.villages[vid].talks[k].materials.length, 0), 0) >= 15 },

    { id: 'a08', name: '笔耕不辍', desc: '提交第一份考察报告', test: s => Object.keys(s.villages).some(vid => s.villages[vid].report && s.villages[vid].report.submitted) },
    { id: 'a09', name: '著述等身', desc: '四村报告全部提交', test: s => root.XT_VILLAGES.VILLAGES.every(v => s.villages[v.id] && s.villages[v.id].report && s.villages[v.id].report.submitted) },
    { id: 'a10', name: '区域比兴', desc: '完成一次双村对比', test: s => s.compareDone.length >= 1 },
    { id: 'a11', name: '空间慧眼', desc: '集齐 8 处地理"发现"', test: s => Object.keys(s.villages).reduce((n, vid) => n + Object.keys(s.villages[vid].finds || {}).length, 0) >= 8 },

  function checkAchievements(state) {

  /* ---------- 教师端：模拟班级（种子确定性，明示演示数据） ---------- */
  const DEMO_SURNAMES = ['王', '李', '张', '刘', '陈', '杨', '黄', '赵', '吴', '周', '徐', '孙', '林', '郑', '谢', '沈'];
  const DEMO_GIVENS = ['梓涵', '一诺', '雨桐', '浩然', '欣怡', '子墨', '思远', '若曦', '俊杰', '语汐', '博文', '诗涵', '志强', '梦洁', '嘉懿', '佳琪'];
  const DEMO_MISCONCEPTIONS = [
    '把"愚"理解成智力问题，忽视"机会与需要"的分析',
    '把差序格局画成"团体格局"：圈子画成有固定边界',
    '把"礼治"与"法治"混为一谈，未抓住维持规范的力量差异',
    '只谈横暴权力，忽略"同意权力"与"无为"的限定条件',
    '把"血缘地缘"讲成城乡差别，未落到交换规则上',

      const talkTurns = Math.floor(rnd() * 22);

    }
    const agg = {
      avgChapters: Math.round(students.reduce((a, b) => a + b.chapters, 0) / N * 10) / 10,

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('on'), 30);
    setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 400); }, 2200);
  }
  function downloadText(name, text) {
    const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });

  function go(hash) { location.hash = hash; }
  function parseRoute() {

    const qs = h.split('?')[1];
    if (qs) qs.split('&').forEach(kv => { const p = kv.split('='); partsArr.query[p[0]] = p[1] || ''; });

  }
  function chConceptPool(village) { return VILLAGES.conceptPool(village.id); }

  /* ---------- SVG 村落图 ---------- */

  function mapLegendHtml() {

  // 首页 hero 手绘田野场景（远山/田畴/村舍/河流/树/飞鸟，纸墨笔触）

  /* ---------- 视图：章节详情 ---------- */
  function viewBook(chId) {

    const read = state.chapters[c.id] && state.chapters[c.id].read;

    const excerpts = c.excerpts.map((e, i) => {

    }).join('');

    }).length;

  function bindMap(vId) {
    const v = VILLAGES.village(vId);
    const box = document.getElementById('mapbox');
    if (!box) return;
    box.addEventListener('click', ev => {
      const g = ev.target.closest('[data-fid]');
      if (g) openFeature(v, g.getAttribute('data-fid'));
    });
  }
  function openFeature(v, fid) {
    const f = VILLAGES.feature(v.id, fid);
    if (!f) return;
    const fs = E.featureState(state, v.id, fid);
    const cc = BOOK.concept;
    const truthTxt = (f.truth || []).map(t => E.conceptName(BOOK, t)).join('、');
    const askHtml = f.ask ? `
      <div class="ask"><b>观察题</b>：${esc(f.ask.q)}</div>
      <div class="opts">${f.ask.options.map((o, i) => `<label class="opt"><input type="radio" name="askopt" value="${i}"/> ${esc(o)}</label>`).join('')}
      <button class="btn sm primary" id="ask-submit">提交观察</button></div>` : '';
    const tagHtml = `
      <div class="ask"><b>概念标注</b>（勾选后保存，对照真值：<b>${esc(truthTxt)}</b>）</div>
      <div class="tagrow">
        ${chConceptPool(v).map(cid => {
          const on = fs.myTags.indexOf(cid) >= 0;
          return `<label class="tagpick sm"><input type="checkbox" value="${cid}" ${on ? 'checked' : ''}/> ${esc(E.conceptName(BOOK, cid))}</label>`;
        }).join('')}
      </div>
      <button class="btn sm" id="tag-save">保存标注（积分+1）</button>`;
    document.getElementById('fpanel').innerHTML = `
      <h3>${esc(f.name)}</h3>
      <p class="fnote">${esc(f.note)}</p>
      ${fs.askOk === 1 ? '<p class="okline">✓ 观察题已答对</p>' : fs.askOk === 0 && fs.seen ? '<p class="badline">观察题上次答错，可重试。</p>' : ''}
      ${askHtml}
      ${tagHtml}`;
    const sub = document.getElementById('ask-submit');
    if (sub) sub.addEventListener('click', () => {
      const checked = document.querySelector('input[name="askopt"]:checked');
      if (!checked) { toast('先选一个答案'); return; }
      const r = E.observe(state, v.id, f, parseInt(checked.value, 10));
      save(); checkAch();
      document.getElementById('ask-result') && document.getElementById('ask-result').remove();
      const div = document.createElement('div');
      div.className = 'ask-result ' + (r.ok ? 'ok' : 'bad');
      div.id = 'ask-result';
      div.innerHTML = (r.ok ? '<b>✓ 判断正确</b>　' : '<b>✗ 再想想</b>　') + esc(r.exp || '');
      sub.parentElement.appendChild(div);
      if (r.ok) toast('观察正确，积分 +2');
      refreshMapSeen(v.id, fid);
    });
    const tg = document.getElementById('tag-save');
    if (tg) tg.addEventListener('click', () => {
      const chosen = Array.from(document.querySelectorAll('.sidepanel .tagpick input:checked')).map(x => x.value);
      E.tagFeature(state, v.id, f, chosen, chConceptPool(v));
      save(); checkAch();
      toast('标注已保存，去"语义分析"页看对照结果');
      refreshMapSeen(v.id, fid);
    });
  }
  function refreshMapSeen(vId, fid) {
    const box = document.getElementById('mapbox');
    if (!box) return;
    const g = box.querySelector('[data-fid="' + fid + '"]');

  /* ---------- 视图：访谈 ---------- */
  function viewTalk(vId, presetNpc) {
    const v = VILLAGES.village(vId);
    if (!v) return '<p class="empty">村落不存在。</p>';
    E.visit(state, v.id);
    const cur = presetNpc || v.npcs[0].id;
    const npcTabs = v.npcs.map(n => `<button class="npctab ${n.id === cur ? 'on' : ''}" data-npc="${n.id}">${esc(n.name)}<span>${esc(n.role)}</span></button>`).join('');
    const apiOn = state.settings.api && state.settings.api.enabled;
    return `
    <div class="crumb"><a href="#/village/${vId}">← ${esc(v.name)}档案</a></div>
    <header class="pagehead"><h1>村民访谈 · ${esc(v.name)}</h1>

      <p class="modebadge">${apiOn ? '模式：已接入 API（失败自动回落离线）' : '模式：离线引擎（设置页可接大模型 API）'}</p>

        <button class="btn primary" id="chatsend">提问</button>

  }
  function matListHtml(vId) {
    const vs = state.villages[vId];
    const mats = Object.keys(vs.talks || {}).flatMap(k => vs.talks[k].materials);
    if (!mats.length) return '<p class="empty">素材库还空着——去和村民聊聊吧。</p>';
    return mats.slice().reverse().map(m => {
      const noteKey = 'mat:' + m.id;
      const note = E.noteOf(state, noteKey);
      return `<div class="mat"><div class="mat-meta">${esc(m.npcName)}·${esc(m.role)} <span class="chip ghost sm">${m.tags.map(t => esc(E.conceptName(BOOK, t))).join('、') || '未标概念'}</span></div><div class="mat-text">${esc(m.text)}</div><details class="notebox"${note ? ' open' : ''}><summary>评语${note ? ' · 已有' : ''}</summary><textarea class="note-text" data-notekey="${noteKey}" maxlength="500" placeholder="给这条素材写句评语（可选）">${esc(note)}</textarea><div class="action-row"><button class="btn sm save-note">保存评语</button></div></details></div>`;
    }).join('');
  }
  function bindTalk(vId, presetNpc) {
    const v = VILLAGES.village(vId);
    if (!v) return;
    let curNpc = presetNpc && v.npcs.find(n => n.id === presetNpc) ? presetNpc : v.npcs[0].id;
    const logEl = document.getElementById('chatlog');
    function renderNpcTabs() {
      document.querySelectorAll('.npctab').forEach(b => b.classList.toggle('on', b.getAttribute('data-npc') === curNpc));
    }
    function npcIntro(n) {
      logEl.appendChild(bubble('npc', esc(n.hello), 'persona：' + esc(n.persona)));
    }
    npcIntro(v.npcs.find(n => n.id === curNpc));
    async function send() {
      const input = document.getElementById('chatin');
      const q = (input.value || '').trim();
      if (!q) return;
      input.value = '';
      logEl.appendChild(bubble('me', esc(q)));
      const npc = v.npcs.find(n => n.id === curNpc);
      let ans = null, mode = '离线引擎';
      const api = state.settings.api;
      if (api && api.enabled && api.url && api.key) {
        try { ans = await remoteAsk(v, npc, q); mode = 'API·' + (api.model || 'model'); }
        catch (e) { ans = null; mode = 'API 失败→离线回落'; }
      }
      if (!ans) { ans = E.askNpc(npc, q); mode = '离线引擎'; }
      const tagsHtml = ans.tags && ans.tags.length ? `<span class="chip ghost sm">自动标注：${ans.tags.map(t => esc(E.conceptName(BOOK, t))).join('、')}</span>` : '';
      const followHtml = (ans.follow || []).map(fq => `<button class="btn sm ghost follow" data-q="${esc(fq)}">${esc(fq)}</button>`).join('');
      const collectHtml = ans.isFallback ? '' : `<button class="btn sm collect">收进素材库</button>`;
      const node = bubble('npc', esc(ans.text) + `<div class="ansmeta">${mode === '离线引擎' ? '' : '<span class="chip ghost sm">' + esc(mode) + '</span>'} ${tagsHtml} ${collectHtml} ${followHtml}</div>`);
      logEl.appendChild(node);
      if (!ans.isFallback) {
        node.querySelector('.collect').addEventListener('click', () => {
          const m = E.collectMaterial(state, v.id, npc, ans);
          save(); checkAch();
          toast(m ? '已收进素材库（积分+1）' : '素材库已满或该村民素材已够');
          const ml = document.getElementById('matlist');
          if (ml) ml.innerHTML = matListHtml(vId);
        });
      }
      node.querySelectorAll('.follow').forEach(b => b.addEventListener('click', () => {
        document.getElementById('chatin').value = b.getAttribute('data-q');
        document.getElementById('chatin').focus();
      }));
      logEl.scrollTop = logEl.scrollHeight;
      if (!ans.isFallback) {
        const t = (state.villages[v.id].talks || {})[npc.id];
        if (t && t.turns % 3 === 0) toast(npc.name + '的素材已 ' + t.materials.length + ' 条');
      }
    }
    document.getElementById('chatsend').addEventListener('click', send);
    document.getElementById('chatin').addEventListener('keydown', ev => { if (ev.key === 'Enter') send(); });
    document.querySelectorAll('.npctab').forEach(b => b.addEventListener('click', () => {
      curNpc = b.getAttribute('data-npc');
      renderNpcTabs();
      logEl.innerHTML = '';
      npcIntro(v.npcs.find(n => n.id === curNpc));
    }));
  }
  function bubble(who, html, sub) {
    const d = document.createElement('div');
    d.className = 'bub ' + who;
    d.innerHTML = `<div class="bub-text">${html}</div>${sub ? '<div class="bub-sub">' + sub + '</div>' : ''}`;
    return d;
  }
  async function remoteAsk(v, npc, q) {
    const api = state.settings.api;
    const concepts = chConceptPool(v).map(cid => { const cc = BOOK.concept(cid); return { id: cid, name: cc.concept.name, def: cc.concept.def }; });
    const sys = PR.PROMPTS.npcTalk.text
      .replace('{ROLE_JSON}', JSON.stringify({ name: npc.name, role: npc.role, age: npc.age, persona: npc.persona, knows: npc.knows, blind: npc.blind }))
      .replace('{VILLAGE_INTRO}', v.intro)
      .replace('{CONCEPTS_JSON}', JSON.stringify(concepts))
      .replace('{HISTORY_JSON}', '[]')
      .replace('{QUESTION}', q);
    const res = await fetch(api.url.replace(/\/$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + api.key },
      body: JSON.stringify({ model: api.model || 'glm-4-flash', messages: [{ role: 'user', content: sys }], temperature: 0.6 })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const txt = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content || '';
    const mjson = txt.match(/\{[\s\S]*\}/);
    if (mjson) {
      try {
        const p = JSON.parse(mjson[0]);
        return { text: String(p.text || txt).slice(0, 400), tags: p.concept ? [p.concept] : [], isFallback: false, follow: (p.follow || []).slice(0, 2) };
      } catch (e) { /* fallthrough */ }
    }
    return { text: txt.slice(0, 400), tags: [], isFallback: false, follow: [] };
  }

      <p class="hint">判定口径：命中任一真值概念＝○；与真值完全一致（数量也一致）＝◎。</p></section>` : '<section class="sec"><p class="empty">先在"空间观察"页完成观察与标注。</p></section>'}
    <section class="sec"><h2>地理"发现"</h2>${finds}</section>`;

  function bindReport(vId) {
    const v = VILLAGES.village(vId);
    if (!v) return;
    const gen = document.getElementById('gen-report');
    if (gen) gen.addEventListener('click', () => {
      const r = E.buildReport(state, v.id, v, BOOK);
      document.getElementById('report-text').value = r.plain;
      toast('初稿已生成——请务必自己改过再交');
    });
    const gr = document.getElementById('grade-report');
    if (gr) gr.addEventListener('click', () => {
      const t = document.getElementById('report-text').value;
      state.villages[v.id].report.text = t;
      const g = E.gradeReport(state, v.id, t, v, BOOK);
      save();
      document.getElementById('gradebox').innerHTML = gradeBoxHtml(g);
    });
    const exp = document.getElementById('export-report');
    if (exp) exp.addEventListener('click', () => {
      const t = document.getElementById('report-text').value;
      if (!t.trim()) { toast('报告正文还是空的'); return; }
      const sub = state.villages[v.id].report && state.villages[v.id].report.submitted;
      const md = ['# 《乡土中国》田野考察报告',
        '- 村落：' + v.name + '（' + v.type + ' · ' + v.region + '）',
        '- 调查员：' + (state.student.name || '无名调查员'),
        '- 日期：' + new Date().toISOString().slice(0, 10),
        sub ? '- 初评：' + sub.grade.score + ' 分' : '- 初评：未提交',
        '', t, '',
        '> 生成自「乡土调查员」· 《乡土中国》田野探究工作坊'].join('\n');
      downloadText('乡土考察报告-' + v.name + '.md', md);
      toast('已导出 Markdown 文件');
    });
    const pr = document.getElementById('print-report');
    if (pr) pr.addEventListener('click', () => {
      const t = document.getElementById('report-text').value;
      if (!t.trim()) { toast('报告正文还是空的'); return; }
      const lines = ['村落：' + v.name + '（' + v.type + ' · ' + v.region + '）',
        '调查员：' + (state.student.name || '无名调查员') + ' · ' + new Date().toISOString().slice(0, 10),
        ''].concat(t.split('\n'));
      printSheet('《乡土中国》田野考察报告 · ' + v.name, lines);
    });
    const sb = document.getElementById('submit-report');
    if (sb) sb.addEventListener('click', () => {
      const t = document.getElementById('report-text').value;
      if (t.replace(/\s/g, '').length < 100) { toast('正文太短，先写满 100 字再交'); return; }
      const g = E.submitReport(state, v.id, t, v, BOOK);
      save(); checkAch();
      document.getElementById('gradebox').innerHTML = gradeBoxHtml(g);
      // 就地更新提交状态，避免整体重渲染吞掉评分反馈
      const gen = document.getElementById('gen-report');
      if (gen && !gen.parentElement.querySelector('.chip.ok')) {
        const chip = document.createElement('span');
        chip.className = 'chip ok';
        chip.textContent = '已提交 · 初评 ' + g.score + ' 分';
        gen.parentElement.appendChild(chip);
      }
      toast('报告已提交：初评 ' + g.score + ' 分');
    });
  }
  function gradeBoxHtml(g) {
    return `<div class="gradebox"><div class="grade-score">初评 ${g.score} 分 ${'★'.repeat(g.stars)}${'☆'.repeat(3 - g.stars)}</div>
      <ul>${g.advice.map(a => '<li>' + esc(a) + '</li>').join('') || '<li>各项达标，可以提交给老师终审。</li>'}</ul></div>`;
  }

  function bindSettings() {
    const apiSave = document.getElementById('api-save');
    if (apiSave) apiSave.addEventListener('click', () => {
      state.settings.api.url = document.getElementById('api-url').value.trim();
      state.settings.api.key = document.getElementById('api-key').value.trim();
      state.settings.api.model = document.getElementById('api-model').value.trim() || 'glm-4-flash';
      save(); toast('API 配置已保存（本地）');
    });
    const tg = document.getElementById('api-toggle');
    if (tg) tg.addEventListener('click', () => {
      if (!state.settings.api.url || !state.settings.api.key) { toast('先填接口地址与 Key'); return; }
      state.settings.api.enabled = !state.settings.api.enabled;
      save(); toast(state.settings.api.enabled ? 'API 已启用' : 'API 已关闭'); render();
    });
    document.querySelectorAll('.copy-prompt').forEach(b => b.addEventListener('click', () => {
      const p = PR.PROMPTS[b.getAttribute('data-k')];
      const ta = document.createElement('textarea');
      ta.value = p.text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制：' + p.name); } catch (e) { toast('复制失败，请手动选择'); }
      ta.remove();
    }));
    const exp = document.getElementById('exp-data');
    if (exp) exp.addEventListener('click', () => {
      const blob = new Blob([E.serialize(state)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'xiangtu-save-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
    });
    const imp = document.getElementById('imp-data');
    if (imp) imp.addEventListener('click', () => document.getElementById('imp-file').click());
    const file = document.getElementById('imp-file');
    if (file) file.addEventListener('change', () => {
      const f = file.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const s = E.deserialize(rd.result);
        if (!s) { toast('存档格式无效'); return; }
        state = s; save(); toast('存档已导入'); render();
      };
      rd.readAsText(f);
    });
    const clr = document.getElementById('clr-data');
    if (clr) clr.addEventListener('click', () => {
      if (!confirm('确定清空全部本地进度？此操作不可恢复。')) return;
      localStorage.removeItem(LS_KEY); state = E.newState(); save(); toast('已清空'); render();
    });
  }

  /* ---------- 成就刷新 ---------- */
  function checkAch() {
    const got = E.checkAchievements(state);
    if (got.length) save();
    got.forEach(a => toast('成就解锁：' + a.name));
    return got;
  }

  /* ---------- 路由 ---------- */
  function render() {
    const r = parseRoute();
    let html = '';
    let binder = null;
    if (r[0] === '' || r[0] === undefined) { html = viewHome(); }
    else if (r[0] === 'book') { html = viewBook(r[1]); }
    else if (r[0] === 'village') {
      const vId = r[1];
      if (!VILLAGES.village(vId)) html = '<p class="empty">村落不存在。</p>';
      else if (r[2] === 'map') { html = viewMap(vId); binder = () => bindMap(vId); }
      else if (r[2] === 'talk') { html = viewTalk(vId, r.query.npc); binder = () => bindTalk(vId, r.query.npc); }
      else if (r[2] === 'analyze') { html = viewAnalyze(vId); binder = () => bindAnalyze(vId); }
      else if (r[2] === 'report') { html = viewReport(vId); binder = () => bindReport(vId); }
      else html = viewVillage(vId);
    }
    else if (r[0] === 'compare') { html = viewCompare(); binder = bindCompare; }
    else if (r[0] === 'ach') { html = viewAch(); }
    else if (r[0] === 'teacher') { html = viewTeacher(); binder = bindTeacher; }
    else if (r[0] === 'settings') { html = viewSettings(); binder = bindSettings; }
    else html = '<p class="empty">页面不存在。</p>';
    app.innerHTML = html;
    if (binder) binder();
    // 章节读毕按钮
    const mr = document.getElementById('mark-read');
    if (mr && !mr.disabled) mr.addEventListener('click', () => {
      E.readChapter(state, r[1]); save(); checkAch(); toast('读毕标记成功，积分+5'); render();
    });
    // 批注保存（章节节选批注 / 素材评语，通用委托；就地更新，不重渲染以免丢未提交的正文）
    app.querySelectorAll('.save-note').forEach(b => b.addEventListener('click', () => {
      const box = b.closest('.notebox');
      const ta = box && box.querySelector('.note-text');
      if (!ta) return;
      const res = E.setNote(state, ta.getAttribute('data-notekey'), ta.value);
      save(); checkAch();
      const sum = box.querySelector('summary');
      if (sum) {
        const base = sum.textContent.replace(' · 已有', '');
        sum.textContent = ta.value.trim() ? base + ' · 已有' : base;
      }
      toast(res.removed ? '批注已清空' : '批注已保存' + (res.created ? '（积分+1）' : ''));
    }));
    window.scrollTo(0, 0);
  }

  /* ---------- 启动 ---------- */
  load();
  window.addEventListener('hashchange', render);
  render();
  save();
})();

</script>
</body>
</html>
